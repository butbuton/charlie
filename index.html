<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чарли vs Мышь</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; font-family: 'SF Mono', 'Courier New', monospace; }
        body { background: #ffffff; color: #000000; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; padding: 12px 8px; overflow: hidden; }
        h1 { font-size: clamp(1rem, 5vw, 1.5rem); font-weight: 700; margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }
        #timer { font-size: clamp(1.2rem, 5vw, 1.8rem); font-weight: 700; padding: 2px 16px; border: 2px solid #000; background: #fff; margin-bottom: 4px; }
        #message { font-size: 0.9rem; font-weight: 700; text-align: center; min-height: 1.2em; margin: 2px 0; }
        .game-panels { display: flex; flex-wrap: nowrap; justify-content: center; gap: 6px; }
        .panel { border: 2px solid #000; padding: 6px; background: #fff; display: flex; flex-direction: column; align-items: center; }
        .panel-label { font-weight: 700; margin-bottom: 2px; text-transform: uppercase; font-size: 0.8rem; }
        canvas { background: #fff; border: 1px solid #000; display: block; }
        .charlie-comment { font-size: 0.7rem; margin-top: 4px; text-align: center; min-height: 1.3em; color: #000; font-style: italic; }
        #restartButton { margin: 8px 0 12px; padding: 8px 22px; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; border: 2px solid #000; background: #fff; color: #000; cursor: pointer; }
        #restartButton:active { background: #000; color: #fff; }
        .touch-hint { font-size: 0.7rem; margin-top: 4px; color: #333; display: none; text-align: center; max-width: 300px; }
        @media (hover: none) and (pointer: coarse) { .touch-hint { display: block; } }
        @media (max-width: 600px) {
            .game-panels { flex-direction: column; align-items: center; gap: 8px; }
            .panel { width: 100%; max-width: 360px; }
        }
    </style>
</head>
<body>
    <h1>Чарли 🧑 vs Мышь 🐭</h1>
    <div id="timer">60</div>
    <div id="message"></div>
    <div class="game-panels">
        <div class="panel">
            <div class="panel-label">Чарли</div>
            <canvas id="canvasCharlie"></canvas>
            <div class="charlie-comment" id="charlieComment"></div>
        </div>
        <div class="panel">
            <div class="panel-label">Мышь</div>
            <canvas id="canvasMouse"></canvas>
        </div>
    </div>
    <button id="restartButton">Начать забег</button>
    <div class="touch-hint">📱 Управление касанием:<br>тап вверху – вверх, внизу – вниз,<br>слева – влево, справа – вправо</div>

    <script>
        (function() {
            const ROWS = 10, COLS = 10;
            let CELL_SIZE = 32;
            const canvasCharlie = document.getElementById('canvasCharlie');
            const ctxCharlie = canvasCharlie.getContext('2d');
            const canvasMouse = document.getElementById('canvasMouse');
            const ctxMouse = canvasMouse.getContext('2d');
            const charlieComment = document.getElementById('charlieComment');

            let loseStreak = 0; // счётчик поражений подряд

            function resizeCanvases() {
                const bodyPadding = 16;
                const gap = 6;
                const panelPadding = 12;
                const headerHeight = document.querySelector('h1').offsetHeight + 
                                     document.getElementById('timer').offsetHeight + 
                                     document.getElementById('message').offsetHeight + 20;
                const restartHeight = document.getElementById('restartButton').offsetHeight + 12;
                const touchHintHeight = document.querySelector('.touch-hint').offsetHeight || 0;
                const commentHeight = charlieComment.offsetHeight || 0;
                const usedVertical = headerHeight + restartHeight + touchHintHeight + commentHeight + bodyPadding;
                const availableWidth = window.innerWidth - bodyPadding - gap - panelPadding;
                const availableHeight = window.innerHeight - usedVertical;
                const isMobile = window.innerWidth <= 600;
                let maxCanvasWidth, maxCanvasHeight;
                if (isMobile) {
                    maxCanvasWidth = availableWidth;
                    maxCanvasHeight = Math.floor(availableHeight / 2) - 4;
                } else {
                    maxCanvasWidth = Math.floor(availableWidth / 2);
                    maxCanvasHeight = availableHeight;
                }
                CELL_SIZE = Math.floor(Math.min(maxCanvasWidth, maxCanvasHeight) / COLS);
                if (CELL_SIZE < 12) CELL_SIZE = 12;
                const canvasSize = CELL_SIZE * COLS;
                canvasCharlie.width = canvasSize;
                canvasCharlie.height = canvasSize;
                canvasMouse.width = canvasSize;
                canvasMouse.height = canvasSize;
            }
            window.addEventListener('resize', resizeCanvases);
            resizeCanvases();

            let maze = [];
            let player = { row: 0, col: 0 };
            let mouse = { row: 0, col: 0 };
            let mousePath = [], mouseStep = 0;
            let gameState = 'idle', startTime = 0;
            const GAME_DURATION = 60;
            const PLAYER_MOVE_DELAY = 110;
            const MOUSE_MOVE_DELAY = 405;
            let lastPlayerMove = 0, mouseNextMove = 0;
            let playerFinished = false, mouseFinished = false;
            const finishRow = ROWS - 1, finishCol = COLS - 1;

            function generateMaze(rows, cols) {
                const cells = Array.from({length: rows}, () => Array.from({length: cols}, () => ({
                    top: true, right: true, bottom: true, left: true, visited: false
                })));
                const stack = [{r: 0, c: 0}];
                cells[0][0].visited = true;
                const dirs = [
                    {dr: -1, dc: 0, wall: 'top', opp: 'bottom'},
                    {dr: 1, dc: 0, wall: 'bottom', opp: 'top'},
                    {dr: 0, dc: -1, wall: 'left', opp: 'right'},
                    {dr: 0, dc: 1, wall: 'right', opp: 'left'}
                ];
                while (stack.length) {
                    const cur = stack[stack.length-1];
                    const neighbors = [];
                    for (const d of dirs) {
                        const nr = cur.r + d.dr, nc = cur.c + d.dc;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !cells[nr][nc].visited)
                            neighbors.push({r: nr, c: nc, wall: d.wall, opp: d.opp});
                    }
                    if (neighbors.length) {
                        const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                        cells[cur.r][cur.c][next.wall] = false;
                        cells[next.r][next.c][next.opp] = false;
                        cells[next.r][next.c].visited = true;
                        stack.push({r: next.r, c: next.c});
                    } else stack.pop();
                }
                return cells;
            }

            function drawMaze(ctx, maze) {
                ctx.clearRect(0, 0, COLS*CELL_SIZE, COLS*CELL_SIZE);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const x = c * CELL_SIZE, y = r * CELL_SIZE;
                        if (maze[r][c].top) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+CELL_SIZE, y); ctx.stroke(); }
                        if (maze[r][c].left) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+CELL_SIZE); ctx.stroke(); }
                        if (maze[r][c].bottom) { ctx.beginPath(); ctx.moveTo(x, y+CELL_SIZE); ctx.lineTo(x+CELL_SIZE, y+CELL_SIZE); ctx.stroke(); }
                        if (maze[r][c].right) { ctx.beginPath(); ctx.moveTo(x+CELL_SIZE, y); ctx.lineTo(x+CELL_SIZE, y+CELL_SIZE); ctx.stroke(); }
                    }
                }
                ctx.fillStyle = '#000';
                ctx.font = `bold ${CELL_SIZE*0.8}px "SF Mono", "Courier New", monospace`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('●', CELL_SIZE/2, CELL_SIZE/2);
                ctx.fillText('🏁', (COLS-1)*CELL_SIZE + CELL_SIZE/2, (ROWS-1)*CELL_SIZE + CELL_SIZE/2);
            }

            function drawCharacter(ctx, row, col, symbol) {
                const x = col * CELL_SIZE + CELL_SIZE/2;
                const y = row * CELL_SIZE + CELL_SIZE/2;
                ctx.fillStyle = '#000';
                ctx.font = `bold ${CELL_SIZE*0.8}px "SF Mono", "Courier New", monospace`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(symbol, x, y);
            }

            function heuristic(r1, c1, r2, c2) { return Math.abs(r1-r2) + Math.abs(c1-c2); }
            function getNeighbors(maze, r, c) {
                const res = [];
                if (!maze[r][c].top && r > 0) res.push({row: r-1, col: c});
                if (!maze[r][c].bottom && r < ROWS-1) res.push({row: r+1, col: c});
                if (!maze[r][c].left && c > 0) res.push({row: r, col: c-1});
                if (!maze[r][c].right && c < COLS-1) res.push({row: r, col: c+1});
                return res;
            }
            function findPath(maze, sr, sc, er, ec) {
                const openSet = [{row: sr, col: sc, g:0, f: heuristic(sr,sc,er,ec), parent: null}];
                const closed = new Set();
                while (openSet.length) {
                    openSet.sort((a,b)=>a.f-b.f);
                    const cur = openSet.shift();
                    const key = `${cur.row},${cur.col}`;
                    if (cur.row===er && cur.col===ec) {
                        const path = [];
                        let node = cur;
                        while (node) { path.unshift({row: node.row, col: node.col}); node = node.parent; }
                        return path;
                    }
                    closed.add(key);
                    for (const n of getNeighbors(maze, cur.row, cur.col)) {
                        const nk = `${n.row},${n.col}`;
                        if (closed.has(nk)) continue;
                        const tg = cur.g + 1;
                        const exist = openSet.find(o => o.row===n.row && o.col===n.col);
                        if (exist) {
                            if (tg < exist.g) { exist.g = tg; exist.f = tg + heuristic(n.row,n.col,er,ec); exist.parent = cur; }
                        } else {
                            openSet.push({row: n.row, col: n.col, g: tg, f: tg+heuristic(n.row,n.col,er,ec), parent: cur});
                        }
                    }
                }
                return [];
            }

            function checkGameOver() {
                if (gameState !== 'playing') return;
                if (playerFinished && !mouseFinished) endGame(true);
                else if (mouseFinished && !playerFinished) endGame(false);
                else if (playerFinished && mouseFinished) endGame(false);
            }

            function endGame(win) {
                gameState = win ? 'win' : 'lose';
                document.getElementById('message').textContent = win ? 'Чарли выиграл!' : 'Мышь победила!';
                if (win) {
                    loseStreak = 0;
                    charlieComment.textContent = '';
                } else {
                    loseStreak++;
                    if (loseStreak === 1) {
                        charlieComment.textContent = 'У-у-у, какой хитрющий мышь';
                    } else if (loseStreak >= 2) {
                        charlieComment.textContent = 'Когда-нибудь я тебя обгоню!';
                    }
                }
                document.getElementById('restartButton').textContent = 'Играть снова';
            }

            function update() {
                if (gameState !== 'playing') return;
                const now = Date.now();
                if (!mouseFinished && now >= mouseNextMove && mouseStep < mousePath.length) {
                    const next = mousePath[mouseStep];
                    mouse.row = next.row; mouse.col = next.col;
                    mouseStep++;
                    mouseNextMove = now + MOUSE_MOVE_DELAY;
                    if (mouseStep >= mousePath.length) { mouseFinished = true; checkGameOver(); }
                }
                const elapsed = (now - startTime) / 1000;
                const remaining = Math.max(0, GAME_DURATION - Math.floor(elapsed));
                document.getElementById('timer').textContent = remaining;
                if (remaining <= 0 && gameState === 'playing') endGame(false);
            }

            function draw() {
                drawMaze(ctxCharlie, maze);
                drawCharacter(ctxCharlie, player.row, player.col, '🧑');
                drawMaze(ctxMouse, maze);
                drawCharacter(ctxMouse, mouse.row, mouse.col, '🐭');
            }

            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }

            function tryMovePlayer(dRow, dCol) {
                if (gameState !== 'playing') return;
                const now = Date.now();
                if (now - lastPlayerMove < PLAYER_MOVE_DELAY) return;
                let newRow = player.row + dRow, newCol = player.col + dCol;
                if (newRow < 0 || newRow >= ROWS || newCol < 0 || newCol >= COLS) return;
                if (dRow === -1 && maze[player.row][player.col].top) return;
                if (dRow === 1 && maze[player.row][player.col].bottom) return;
                if (dCol === -1 && maze[player.row][player.col].left) return;
                if (dCol === 1 && maze[player.row][player.col].right) return;
                player.row = newRow; player.col = newCol;
                lastPlayerMove = now;
                if (player.row === finishRow && player.col === finishCol) { playerFinished = true; checkGameOver(); }
            }

            // Управление касаниями
            function handleTouchDirection(e) {
                if (gameState !== 'playing') return;
                if (e.target.closest('button')) return;
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                const dx = e.clientX - cx;
                const dy = e.clientY - cy;
                if (Math.abs(dx) > Math.abs(dy)) {
                    tryMovePlayer(0, dx > 0 ? 1 : -1);
                } else {
                    tryMovePlayer(dy > 0 ? 1 : -1, 0);
                }
                e.preventDefault();
            }

            document.addEventListener('pointerdown', handleTouchDirection);

            // Клавиатура
            document.addEventListener('keydown', (e) => {
                if (gameState !== 'playing') return;
                e.preventDefault();
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') tryMovePlayer(-1, 0);
                else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') tryMovePlayer(1, 0);
                else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') tryMovePlayer(0, -1);
                else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') tryMovePlayer(0, 1);
            });

            // Кнопка старта/рестарта
            function restartGame() {
                maze = generateMaze(ROWS, COLS);
                player = { row: 0, col: 0 };
                mouse = { row: 0, col: 0 };
                mousePath = findPath(maze, 0, 0, finishRow, finishCol);
                mouseStep = 1;
                if (mousePath.length > 0) { mouse.row = mousePath[0].row; mouse.col = mousePath[0].col; }
                playerFinished = false; mouseFinished = false;
                gameState = 'playing';
                startTime = Date.now();
                lastPlayerMove = 0;
                mouseNextMove = startTime + 900;
                document.getElementById('message').textContent = '';
                charlieComment.textContent = '';
                document.getElementById('restartButton').textContent = 'Перезапустить';
                document.getElementById('timer').textContent = GAME_DURATION;
            }

            document.getElementById('restartButton').addEventListener('click', (e) => {
                e.stopPropagation();
                restartGame();
            });
            document.getElementById('restartButton').addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                restartGame();
            });

            // Инициализация
            maze = generateMaze(ROWS, COLS);
            mousePath = findPath(maze, 0, 0, finishRow, finishCol);
            mouse.row = 0; mouse.col = 0;
            player.row = 0; player.col = 0;
            gameState = 'idle';
            document.getElementById('timer').textContent = GAME_DURATION;

            resizeCanvases();
            requestAnimationFrame(gameLoop);
        })();
    </script>
</body>
</html>
