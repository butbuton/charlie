<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чарли vs Мышь</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; font-family: 'SF Mono', 'Courier New', monospace; }
        body {
            background: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 12px 8px;
            overflow: hidden;
        }
        h1 {
            font-size: clamp(1rem, 5vw, 1.5rem);
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
        }
        #timer {
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            font-weight: 700;
            padding: 4px 18px;
            border: 2px solid #ffffff;
            background: #000;
            color: #fff;
            margin-bottom: 8px;
        }
        #gameCanvas {
            background: #000;
            border: 3px solid #ffffff;
            display: block;
            margin: 0 auto;
            touch-action: manipulation;
        }
        .dpad {
            display: grid;
            grid-template-columns: 48px 48px 48px;
            grid-template-rows: 48px 48px 48px;
            gap: 4px;
            margin: 16px 0 20px;
        }
        .dpad button {
            background: #000;
            border: 2px solid #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            color: #ffffff;
            transition: background 0.1s, color 0.1s;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .dpad button:active {
            background: #ffffff;
            color: #000000;
        }
        .dpad .empty {
            border: none;
            background: transparent;
            pointer-events: none;
        }
        #restartButton {
            margin: 0 0 12px;
            padding: 8px 22px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            border: 2px solid #ffffff;
            background: #000;
            color: #fff;
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
        }
        #restartButton:active {
            background: #ffffff;
            color: #000000;
        }

        /* Всплывающая плашка */
        #toast {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #ffffff;
            color: #000000;
            border: 2px solid #000;
            padding: 16px 20px;
            z-index: 10;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            max-width: 300px;
            box-shadow: 0 0 0 2px #fff;
            line-height: 1.4;
        }
        #toast .icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 6px;
        }
        #toast .toast-text {
            margin-bottom: 12px;
        }
        .toast-button {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 18px;
            border: 2px solid #000;
            background: #000;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: background 0.1s, color 0.1s;
        }
        .toast-button:active {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <h1>Чарли 🧑 vs Мышь 🐭</h1>
    <div id="timer">60</div>
    <canvas id="gameCanvas"></canvas>
    <div class="dpad">
        <div class="empty"></div> <button id="btnUp">↑</button> <div class="empty"></div>
        <button id="btnLeft">←</button> <div class="empty"></div> <button id="btnRight">→</button>
        <div class="empty"></div> <button id="btnDown">↓</button> <div class="empty"></div>
    </div>
    <button id="restartButton">Начать забег</button>

    <!-- Плашка с сообщением -->
    <div id="toast">
        <span class="icon">🧑</span>
        <div class="toast-text" id="toastText"></div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            const toastIcon = toast.querySelector('.icon');
            const ROWS = 10, COLS = 10;
            let CELL_SIZE = 32;

            function resizeCanvas() {
                const maxWidth = window.innerWidth - 24;
                const usedHeight = 200 + 160 + 60;
                const maxHeight = window.innerHeight - usedHeight;
                CELL_SIZE = Math.floor(Math.min(maxWidth / COLS, maxHeight / ROWS));
                if (CELL_SIZE < 14) CELL_SIZE = 14;
                const canvasSize = CELL_SIZE * COLS;
                canvas.width = canvasSize;
                canvas.height = canvasSize;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            let maze, player, mouse, mousePath, mouseStep;
            let gameState = 'idle', startTime = 0;
            const GAME_DURATION = 60;
            const PLAYER_DELAY = 110;
            const MOUSE_DELAY = 405;
            let lastPlayerMove = 0, mouseNextMove = 0;
            let playerFinished = false, mouseFinished = false;
            const FINISH_ROW = ROWS - 1, FINISH_COL = COLS - 1;
            let loseStreak = 0;

            function generateMaze() {
                const cells = Array.from({length: ROWS}, () => Array.from({length: COLS}, () => ({
                    top: true, right: true, bottom: true, left: true, visited: false
                })));
                const stack = [{r: 0, c: 0}];
                cells[0][0].visited = true;
                const dirs = [
                    {dr: -1, dc: 0, wall: 'top', opp: 'bottom'},
                    {dr: 1, dc: 0, wall: 'bottom', opp: 'top'},
                    {dr: 0, dc: -1, wall: 'left', opp: 'right'},
                    {dr: 0, dc: 1, wall: 'right', opp: 'left'}
                ];
                while (stack.length) {
                    const cur = stack[stack.length-1];
                    const neighbors = [];
                    for (const d of dirs) {
                        const nr = cur.r + d.dr, nc = cur.c + d.dc;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !cells[nr][nc].visited)
                            neighbors.push({r: nr, c: nc, wall: d.wall, opp: d.opp});
                    }
                    if (neighbors.length) {
                        const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                        cells[cur.r][cur.c][next.wall] = false;
                        cells[next.r][next.c][next.opp] = false;
                        cells[next.r][next.c].visited = true;
                        stack.push({r: next.r, c: next.c});
                    } else stack.pop();
                }
                return cells;
            }

            function drawMaze() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const x = c * CELL_SIZE, y = r * CELL_SIZE;
                        if (maze[r][c].top)    { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+CELL_SIZE, y); ctx.stroke(); }
                        if (maze[r][c].left)   { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+CELL_SIZE); ctx.stroke(); }
                        if (maze[r][c].bottom) { ctx.beginPath(); ctx.moveTo(x, y+CELL_SIZE); ctx.lineTo(x+CELL_SIZE, y+CELL_SIZE); ctx.stroke(); }
                        if (maze[r][c].right)  { ctx.beginPath(); ctx.moveTo(x+CELL_SIZE, y); ctx.lineTo(x+CELL_SIZE, y+CELL_SIZE); ctx.stroke(); }
                    }
                }
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${CELL_SIZE*0.7}px "SF Mono", "Courier New", monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('○', CELL_SIZE/2, CELL_SIZE/2);
                ctx.fillText('🏁', (COLS-1)*CELL_SIZE + CELL_SIZE/2, (ROWS-1)*CELL_SIZE + CELL_SIZE/2);
            }

            function drawCharacters() {
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${CELL_SIZE*0.8}px "SF Mono", "Courier New", monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const px = player.col * CELL_SIZE + CELL_SIZE/2;
                const py = player.row * CELL_SIZE + CELL_SIZE/2;
                ctx.fillText('🧑', px, py);
                const mx = mouse.col * CELL_SIZE + CELL_SIZE/2;
                const my = mouse.row * CELL_SIZE + CELL_SIZE/2;
                ctx.fillText('🐭', mx, my);
            }

            function heuristic(r1, c1, r2, c2) { return Math.abs(r1-r2) + Math.abs(c1-c2); }
            function getNeighbors(r, c) {
                const res = [];
                if (!maze[r][c].top && r > 0) res.push({row: r-1, col: c});
                if (!maze[r][c].bottom && r < ROWS-1) res.push({row: r+1, col: c});
                if (!maze[r][c].left && c > 0) res.push({row: r, col: c-1});
                if (!maze[r][c].right && c < COLS-1) res.push({row: r, col: c+1});
                return res;
            }
            function findPath(sr, sc, er, ec) {
                const openSet = [{row: sr, col: sc, g:0, f: heuristic(sr,sc,er,ec), parent: null}];
                const closed = new Set();
                while (openSet.length) {
                    openSet.sort((a,b)=>a.f-b.f);
                    const cur = openSet.shift();
                    const key = `${cur.row},${cur.col}`;
                    if (cur.row===er && cur.col===ec) {
                        const path = [];
                        let node = cur;
                        while (node) { path.unshift({row: node.row, col: node.col}); node = node.parent; }
                        return path;
                    }
                    closed.add(key);
                    for (const n of getNeighbors(cur.row, cur.col)) {
                        const nk = `${n.row},${n.col}`;
                        if (closed.has(nk)) continue;
                        const tg = cur.g + 1;
                        const exist = openSet.find(o => o.row===n.row && o.col===n.col);
                        if (exist) {
                            if (tg < exist.g) { exist.g = tg; exist.f = tg + heuristic(n.row,n.col,er,ec); exist.parent = cur; }
                        } else {
                            openSet.push({row: n.row, col: n.col, g: tg, f: tg+heuristic(n.row,n.col,er,ec), parent: cur});
                        }
                    }
                }
                return [];
            }

            function checkFinish() {
                if (gameState !== 'playing') return;
                if (playerFinished && !mouseFinished) endGame(true);
                else if (mouseFinished && !playerFinished) endGame(false);
                else if (playerFinished && mouseFinished) endGame(false);
            }

            function showWinToast() {
                toastIcon.style.display = 'none';
                toastText.innerHTML = `
                    <p style="margin-bottom:6px;">Вы хорошо умеете находить выходы в лабиринтах! А значит, легко найдете дорогу и вход в ДК «Химволокно».</p>
                    <p style="margin-bottom:8px;">Приходите 3 мая в 17:00 часов на спектакль «Дневник Чарли Гордона»</p>
                    <a href="https://tver.kassir.ru/teatr/dnevnik-charli-gordona" target="_blank" class="toast-button">Билеты тут</a>
                `;
                toast.style.display = 'block';
            }

            function showLoseToast(text) {
                toastIcon.style.display = 'block';
                toastText.textContent = text;
                toast.style.display = 'block';
            }

            function hideToast() {
                toast.style.display = 'none';
            }

            function endGame(win) {
                gameState = win ? 'win' : 'lose';
                if (win) {
                    loseStreak = 0;
                    showWinToast();
                } else {
                    loseStreak++;
                    showLoseToast(loseStreak === 1 ? 'У-у-у, какой хитрющий мышь' : 'Когда-нибудь я тебя обгоню!');
                }
                document.getElementById('restartButton').textContent = 'Играть снова';
            }

            function tryMovePlayer(dRow, dCol) {
                if (gameState !== 'playing') return false;
                const now = Date.now();
                if (now - lastPlayerMove < PLAYER_DELAY) return false;
                const newRow = player.row + dRow, newCol = player.col + dCol;
                if (newRow < 0 || newRow >= ROWS || newCol < 0 || newCol >= COLS) return false;
                if (dRow === -1 && maze[player.row][player.col].top) return false;
                if (dRow === 1 && maze[player.row][player.col].bottom) return false;
                if (dCol === -1 && maze[player.row][player.col].left) return false;
                if (dCol === 1 && maze[player.row][player.col].right) return false;
                player.row = newRow;
                player.col = newCol;
                lastPlayerMove = now;
                if (player.row === FINISH_ROW && player.col === FINISH_COL) {
                    playerFinished = true;
                    checkFinish();
                }
                return true;
            }

            let holdInterval = null;
            let currentDir = null;

            function startDirection(dr, dc) {
                stopDirection();
                currentDir = { dr, dc };
                tryMovePlayer(dr, dc);
                holdInterval = setInterval(() => tryMovePlayer(dr, dc), PLAYER_DELAY);
            }

            function stopDirection() {
                if (holdInterval) {
                    clearInterval(holdInterval);
                    holdInterval = null;
                }
                currentDir = null;
            }

            function handleKeyDown(e) {
                const key = e.key;
                if (key === ' ' || key === 'Spacebar') {
                    e.preventDefault();
                    if (gameState !== 'playing') restartGame();
                    return;
                }
                if (gameState !== 'playing') return;
                e.preventDefault();
                if (key === 'ArrowUp' || key === 'w' || key === 'W') startDirection(-1, 0);
                else if (key === 'ArrowDown' || key === 's' || key === 'S') startDirection(1, 0);
                else if (key === 'ArrowLeft' || key === 'a' || key === 'A') startDirection(0, -1);
                else if (key === 'ArrowRight' || key === 'd' || key === 'D') startDirection(0, 1);
            }

            function handleKeyUp(e) {
                const key = e.key;
                if (key.startsWith('Arrow') || key === 'w' || key === 'W' || key === 's' || key === 'S' || key === 'a' || key === 'A' || key === 'd' || key === 'D') {
                    stopDirection();
                    e.preventDefault();
                }
            }

            function update() {
                if (gameState !== 'playing') return;
                const now = Date.now();
                if (!mouseFinished && now >= mouseNextMove && mouseStep < mousePath.length) {
                    const nxt = mousePath[mouseStep];
                    mouse.row = nxt.row;
                    mouse.col = nxt.col;
                    mouseStep++;
                    mouseNextMove = now + MOUSE_DELAY;
                    if (mouseStep >= mousePath.length) {
                        mouseFinished = true;
                        checkFinish();
                    }
                }
                const elapsed = (now - startTime) / 1000;
                const remain = Math.max(0, GAME_DURATION - Math.floor(elapsed));
                document.getElementById('timer').textContent = remain;
                if (remain <= 0 && gameState === 'playing') endGame(false);
            }

            function draw() {
                drawMaze();
                drawCharacters();
            }

            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }

            function restartGame() {
                stopDirection();
                hideToast();
                maze = generateMaze();
                player = { row: 0, col: 0 };
                mouse = { row: 0, col: 0 };
                mousePath = findPath(0, 0, FINISH_ROW, FINISH_COL);
                mouseStep = 1;
                if (mousePath.length > 0) {
                    mouse.row = mousePath[0].row;
                    mouse.col = mousePath[0].col;
                }
                playerFinished = false;
                mouseFinished = false;
                gameState = 'playing';
                startTime = Date.now();
                lastPlayerMove = 0;
                mouseNextMove = startTime + 900;
                document.getElementById('timer').textContent = GAME_DURATION;
                document.getElementById('restartButton').textContent = 'Перезапустить';
            }

            document.getElementById('btnUp').addEventListener('pointerdown', (e) => { e.preventDefault(); startDirection(-1, 0); });
            document.getElementById('btnDown').addEventListener('pointerdown', (e) => { e.preventDefault(); startDirection(1, 0); });
            document.getElementById('btnLeft').addEventListener('pointerdown', (e) => { e.preventDefault(); startDirection(0, -1); });
            document.getElementById('btnRight').addEventListener('pointerdown', (e) => { e.preventDefault(); startDirection(0, 1); });

            document.querySelectorAll('.dpad button').forEach(btn => {
                btn.addEventListener('pointerup', stopDirection);
                btn.addEventListener('pointerleave', stopDirection);
            });

            document.getElementById('restartButton').addEventListener('click', restartGame);
            document.getElementById('restartButton').addEventListener('touchstart', (e) => {
                e.preventDefault();
                restartGame();
            });

            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);

            maze = generateMaze();
            mousePath = findPath(0, 0, FINISH_ROW, FINISH_COL);
            mouse = { row: 0, col: 0 };
            player = { row: 0, col: 0 };
            gameState = 'idle';
            document.getElementById('timer').textContent = GAME_DURATION;
            resizeCanvas();
            requestAnimationFrame(gameLoop);
        })();
    </script>
</body>
</html>
