<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чарли vs Мышь</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; font-family: 'SF Mono', 'Courier New', monospace; }
        body { background: #ffffff; color: #000000; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; padding: 12px 8px; overflow: hidden; }
        h1 { font-size: clamp(1rem, 5vw, 1.5rem); font-weight: 700; margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }
        #timer { font-size: clamp(1.2rem, 5vw, 1.8rem); font-weight: 700; padding: 2px 16px; border: 2px solid #000; background: #fff; margin-bottom: 4px; }
        #gameCanvas { background: #fff; border: 3px solid #000; display: block; margin: 0 auto; }
        #restartButton { margin: 8px 0 12px; padding: 8px 22px; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; border: 2px solid #000; background: #fff; color: #000; cursor: pointer; }
        #restartButton:active { background: #000; color: #fff; }

        /* Всплывающая плашка */
        #toast {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 12px 20px;
            z-index: 10;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            max-width: 280px;
            box-shadow: 0 0 0 2px #000;
        }
        #toast .icon { font-size: 2rem; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
    <h1>Чарли 🧑 vs Мышь 🐭</h1>
    <div id="timer">60</div>
    <canvas id="gameCanvas"></canvas>
    <button id="restartButton">Начать забег</button>

    <!-- Плашка с комментарием Чарли -->
    <div id="toast">
        <span class="icon">🧑</span>
        <span id="toastText"></span>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            const ROWS = 10, COLS = 10;
            let CELL_SIZE = 32;

            // Размер канваса под экран (один лабиринт на всё)
            function resizeCanvas() {
                const maxWidth = window.innerWidth - 24;   // отступы body
                const maxHeight = window.innerHeight - 200; // примерный запас под заголовок, таймер, кнопку
                // дополнительный учёт высоты плашки (когда она показывается, но она fixed)
                const availableWidth = maxWidth;
                const availableHeight = maxHeight;
                CELL_SIZE = Math.floor(Math.min(availableWidth / COLS, availableHeight / ROWS));
                if (CELL_SIZE < 14) CELL_SIZE = 14;
                const canvasSize = CELL_SIZE * COLS;
                canvas.width = canvasSize;
                canvas.height = canvasSize;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Игровые переменные
            let maze, player, mouse, mousePath, mouseStep;
            let gameState = 'idle', startTime = 0;
            const GAME_DURATION = 60;
            const PLAYER_DELAY = 110;
            const MOUSE_DELAY = 405; // мышь медленнее в 1.5 раза
            let lastPlayerMove = 0, mouseNextMove = 0;
            let playerFinished = false, mouseFinished = false;
            const FINISH_ROW = ROWS - 1, FINISH_COL = COLS - 1;
            let loseStreak = 0;

            // Вспомогательные функции (генерация, A*, отрисовка)
            function generateMaze() {
                const cells = Array.from({length: ROWS}, () => Array.from({length: COLS}, () => ({
                    top: true, right: true, bottom: true, left: true, visited: false
                })));
                const stack = [{r: 0, c: 0}];
                cells[0][0].visited = true;
                const dirs = [
                    {dr: -1, dc: 0, wall: 'top', opp: 'bottom'},
                    {dr: 1, dc: 0, wall: 'bottom', opp: 'top'},
                    {dr: 0, dc: -1, wall: 'left', opp: 'right'},
                    {dr: 0, dc: 1, wall: 'right', opp: 'left'}
                ];
                while (stack.length) {
                    const cur = stack[stack.length-1];
                    const neighbors = [];
                    for (const d of dirs) {
                        const nr = cur.r + d.dr, nc = cur.c + d.dc;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !cells[nr][nc].visited)
                            neighbors.push({r: nr, c: nc, wall: d.wall, opp: d.opp});
                    }
                    if (neighbors.length) {
                        const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                        cells[cur.r][cur.c][next.wall] = false;
                        cells[next.r][next.c][next.opp] = false;
                        cells[next.r][next.c].visited = true;
                        stack.push({r: next.r, c: next.c});
                    } else stack.pop();
                }
                return cells;
            }

            function drawMaze() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const x = c * CELL_SIZE, y = r * CELL_SIZE;
                        if (maze[r][c].top)    { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+CELL_SIZE, y); ctx.stroke(); }
                        if (maze[r][c].left)   { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+CELL_SIZE); ctx.stroke(); }
                        if (maze[r][c].bottom) { ctx.beginPath(); ctx.moveTo(x, y+CELL_SIZE); ctx.lineTo(x+CELL_SIZE, y+CELL_SIZE); ctx.stroke(); }
                        if (maze[r][c].right)  { ctx.beginPath(); ctx.moveTo(x+CELL_SIZE, y); ctx.lineTo(x+CELL_SIZE, y+CELL_SIZE); ctx.stroke(); }
                    }
                }
                // старт и финиш
                ctx.fillStyle = '#000';
                ctx.font = `bold ${CELL_SIZE*0.8}px "SF Mono", "Courier New", monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('●', CELL_SIZE/2, CELL_SIZE/2);
                ctx.fillText('🏁', (COLS-1)*CELL_SIZE + CELL_SIZE/2, (ROWS-1)*CELL_SIZE + CELL_SIZE/2);
            }

            function drawCharacters() {
                ctx.fillStyle = '#000';
                ctx.font = `bold ${CELL_SIZE*0.8}px "SF Mono", "Courier New", monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Чарли
                const px = player.col * CELL_SIZE + CELL_SIZE/2;
                const py = player.row * CELL_SIZE + CELL_SIZE/2;
                ctx.fillText('🧑', px, py);
                // Мышь
                const mx = mouse.col * CELL_SIZE + CELL_SIZE/2;
                const my = mouse.row * CELL_SIZE + CELL_SIZE/2;
                ctx.fillText('🐭', mx, my);
            }

            function heuristic(r1, c1, r2, c2) { return Math.abs(r1-r2) + Math.abs(c1-c2); }
            function getNeighbors(r, c) {
                const res = [];
                if (!maze[r][c].top && r > 0) res.push({row: r-1, col: c});
                if (!maze[r][c].bottom && r < ROWS-1) res.push({row: r+1, col: c});
                if (!maze[r][c].left && c > 0) res.push({row: r, col: c-1});
                if (!maze[r][c].right && c < COLS-1) res.push({row: r, col: c+1});
                return res;
            }
            function findPath(sr, sc, er, ec) {
                const openSet = [{row: sr, col: sc, g:0, f: heuristic(sr,sc,er,ec), parent: null}];
                const closed = new Set();
                while (openSet.length) {
                    openSet.sort((a,b)=>a.f-b.f);
                    const cur = openSet.shift();
                    const key = `${cur.row},${cur.col}`;
                    if (cur.row===er && cur.col===ec) {
                        const path = [];
                        let node = cur;
                        while (node) { path.unshift({row: node.row, col: node.col}); node = node.parent; }
                        return path;
                    }
                    closed.add(key);
                    for (const n of getNeighbors(cur.row, cur.col)) {
                        const nk = `${n.row},${n.col}`;
                        if (closed.has(nk)) continue;
                        const tg = cur.g + 1;
                        const exist = openSet.find(o => o.row===n.row && o.col===n.col);
                        if (exist) {
                            if (tg < exist.g) { exist.g = tg; exist.f = tg + heuristic(n.row,n.col,er,ec); exist.parent = cur; }
                        } else {
                            openSet.push({row: n.row, col: n.col, g: tg, f: tg+heuristic(n.row,n.col,er,ec), parent: cur});
                        }
                    }
                }
                return [];
            }

            // Проверка завершения
            function checkFinish() {
                if (gameState !== 'playing') return;
                if (playerFinished && !mouseFinished) endGame(true);
                else if (mouseFinished && !playerFinished) endGame(false);
                else if (playerFinished && mouseFinished) endGame(false);
            }

            function showToast(text) {
                toastText.textContent = text;
                toast.style.display = 'block';
            }

            function hideToast() {
                toast.style.display = 'none';
            }

            function endGame(win) {
                gameState = win ? 'win' : 'lose';
                if (win) {
                    loseStreak = 0;
                    hideToast();
                } else {
                    loseStreak++;
                    if (loseStreak === 1) {
                        showToast('У-у-у, какой хитрющий мышь');
                    } else {
                        showToast('Когда-нибудь я тебя обгоню!');
                    }
                }
                document.getElementById('restartButton').textContent = 'Играть снова';
            }

            // Движение игрока
            function tryMovePlayer(dRow, dCol) {
                if (gameState !== 'playing') return false;
                const now = Date.now();
                if (now - lastPlayerMove < PLAYER_DELAY) return false;
                const newRow = player.row + dRow;
                const newCol = player.col + dCol;
                if (newRow < 0 || newRow >= ROWS || newCol < 0 || newCol >= COLS) return false;
                if (dRow === -1 && maze[player.row][player.col].top) return false;
                if (dRow === 1 && maze[player.row][player.col].bottom) return false;
                if (dCol === -1 && maze[player.row][player.col].left) return false;
                if (dCol === 1 && maze[player.row][player.col].right) return false;
                player.row = newRow;
                player.col = newCol;
                lastPlayerMove = now;
                if (player.row === FINISH_ROW && player.col === FINISH_COL) {
                    playerFinished = true;
                    checkFinish();
                }
                return true;
            }

            // Определение направления по координатам внутри canvas (краевые зоны)
            function getDirectionFromPoint(x, y) {
                const w = canvas.width, h = canvas.height;
                const topThres = 0.3 * h;
                const bottomThres = 0.7 * h;
                const leftThres = 0.3 * w;
                const rightThres = 0.7 * w;
                let vert = null, horiz = null;
                let vertStrength = 0, horizStrength = 0;

                if (y < topThres) {
                    vert = 'up';
                    vertStrength = (topThres - y) / topThres;
                } else if (y > bottomThres) {
                    vert = 'down';
                    vertStrength = (y - bottomThres) / (h - bottomThres);
                }
                if (x < leftThres) {
                    horiz = 'left';
                    horizStrength = (leftThres - x) / leftThres;
                } else if (x > rightThres) {
                    horiz = 'right';
                    horizStrength = (x - rightThres) / (w - rightThres);
                }

                if (!vert && !horiz) return null;
                if (vert && !horiz) return { dr: vert === 'up' ? -1 : 1, dc: 0 };
                if (!vert && horiz) return { dr: 0, dc: horiz === 'left' ? -1 : 1 };
                // оба направления — выбираем по большей силе (ближе к краю)
                return vertStrength >= horizStrength ?
                    { dr: vert === 'up' ? -1 : 1, dc: 0 } :
                    { dr: 0, dc: horiz === 'left' ? -1 : 1 };
            }

            // Переменные для удержания направления
            let heldDirection = null;
            let holdInterval = null;

            function startHolding(direction) {
                stopHolding();
                if (!direction) return;
                heldDirection = direction;
                tryMovePlayer(direction.dr, direction.dc);
                holdInterval = setInterval(() => {
                    tryMovePlayer(direction.dr, direction.dc);
                }, PLAYER_DELAY);
            }

            function stopHolding() {
                if (holdInterval) {
                    clearInterval(holdInterval);
                    holdInterval = null;
                }
                heldDirection = null;
            }

            // Обработчики ввода
            function handlePointerDown(e) {
                if (gameState !== 'playing') return;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;   // отношение реальных пикселей canvas к CSS
                const scaleY = canvas.height / rect.height;
                const x = (e.clientX - rect.left) * scaleX;
                const y = (e.clientY - rect.top) * scaleY;
                const dir = getDirectionFromPoint(x, y);
                startHolding(dir);
                e.preventDefault();
            }

            function handlePointerUp(e) {
                stopHolding();
                e.preventDefault();
            }

            // Клавиатура
            function handleKeyDown(e) {
                if (gameState !== 'playing') return;
                const key = e.key;
                e.preventDefault();
                if (key === 'ArrowUp' || key === 'w' || key === 'W') startHolding({dr: -1, dc: 0});
                else if (key === 'ArrowDown' || key === 's' || key === 'S') startHolding({dr: 1, dc: 0});
                else if (key === 'ArrowLeft' || key === 'a' || key === 'A') startHolding({dr: 0, dc: -1});
                else if (key === 'ArrowRight' || key === 'd' || key === 'D') startHolding({dr: 0, dc: 1});
            }

            function handleKeyUp(e) {
                const key = e.key;
                if (key.startsWith('Arrow') || key === 'w' || key === 'W' || key === 's' || key === 'S' || key === 'a' || key === 'A' || key === 'd' || key === 'D') {
                    stopHolding();
                    e.preventDefault();
                }
            }

            // Игровой цикл
            function update() {
                if (gameState !== 'playing') return;
                const now = Date.now();
                // движение мыши
                if (!mouseFinished && now >= mouseNextMove && mouseStep < mousePath.length) {
                    const next = mousePath[mouseStep];
                    mouse.row = next.row;
                    mouse.col = next.col;
                    mouseStep++;
                    mouseNextMove = now + MOUSE_DELAY;
                    if (mouseStep >= mousePath.length) {
                        mouseFinished = true;
                        checkFinish();
                    }
                }
                // таймер
                const elapsed = (now - startTime) / 1000;
                const remaining = Math.max(0, GAME_DURATION - Math.floor(elapsed));
                document.getElementById('timer').textContent = remaining;
                if (remaining <= 0 && gameState === 'playing') endGame(false);
            }

            function draw() {
                drawMaze();
                drawCharacters();
            }

            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }

            // Запуск / перезапуск
            function restartGame() {
                stopHolding();
                hideToast();
                maze = generateMaze();
                player = { row: 0, col: 0 };
                mouse = { row: 0, col: 0 };
                mousePath = findPath(0, 0, FINISH_ROW, FINISH_COL);
                mouseStep = 1; // мышь уже стоит на старте
                if (mousePath.length > 0) {
                    mouse.row = mousePath[0].row;
                    mouse.col = mousePath[0].col;
                }
                playerFinished = false;
                mouseFinished = false;
                gameState = 'playing';
                startTime = Date.now();
                lastPlayerMove = 0;
                mouseNextMove = startTime + 900;
                document.getElementById('timer').textContent = GAME_DURATION;
                document.getElementById('restartButton').textContent = 'Перезапустить';
            }

            // Привязка событий
            canvas.addEventListener('pointerdown', handlePointerDown);
            canvas.addEventListener('pointerup', handlePointerUp);
            canvas.addEventListener('pointerleave', handlePointerUp); // палец ушёл за пределы
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            document.getElementById('restartButton').addEventListener('click', restartGame);
            document.getElementById('restartButton').addEventListener('touchstart', (e) => {
                e.preventDefault();
                restartGame();
            });

            // Инициализация
            maze = generateMaze();
            mousePath = findPath(0, 0, FINISH_ROW, FINISH_COL);
            mouse = { row: 0, col: 0 };
            player = { row: 0, col: 0 };
            gameState = 'idle';
            document.getElementById('timer').textContent = GAME_DURATION;
            resizeCanvas();
            requestAnimationFrame(gameLoop);
        })();
    </script>
</body>
</html>
